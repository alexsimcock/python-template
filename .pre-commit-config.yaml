default_install_hook_types:
  - pre-commit
  - commit-msg
  - pre-push

repos:
  # ── General hygiene ────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace        # Strip trailing whitespace
      - id: end-of-file-fixer          # Ensure files end with a newline
      - id: mixed-line-ending          # Normalise line endings
        args: [--fix=lf]
      - id: check-merge-conflict       # Block accidental merge conflict markers
      - id: check-case-conflict        # Catch case-insensitive filename clashes
      - id: check-added-large-files    # Warn on large files being committed
        args: [--maxkb=1000]
      - id: check-yaml                 # Validate YAML syntax
      - id: check-toml                 # Validate TOML syntax
      - id: check-json                 # Validate JSON syntax
      - id: pretty-format-json         # Auto-format JSON files
        args: [--autofix, --indent=2]
      - id: check-symlinks             # Detect broken symlinks
      - id: destroyed-symlinks         # Detect symlinks changed to regular files
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key         # Block accidentally committed private keys
      - id: debug-statements           # Block leftover debugger calls (pdb, etc.)
      - id: check-ast                  # Ensure Python files parse as valid AST

  # ── Secrets scanning ───────────────────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.27.2
    hooks:
      - id: gitleaks

  # uv-installed developer tools are run locally so that versions do not drift
  - repo: local
    hooks:
      # ── Python: Ruff (lint + format) ───────────────────────────────────────
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      # ── Python: type checking ──────────────────────────────────────────────
      - id: mypy
        name: mypy
        entry: uv run mypy .
        language: system
        types: [python]
        pass_filenames: false

  # ── Commitizen: commit-msg format ──────────────────────────────────────────
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.4.1
    hooks:
      - id: commitizen                 # Enforce Conventional Commits on messages
        stages: [commit-msg]
      - id: commitizen-branch          # Enforce branch naming conventions
        stages: [pre-push]
        args: [--allow-abort]
