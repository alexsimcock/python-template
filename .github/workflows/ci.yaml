name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Cancel any in-flight run for the same branch when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal read-only default; jobs that need write access declare it explicitly
permissions:
  contents: read

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff — check
        run: uv run ruff check . --output-format=github

      - name: Ruff — format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy .

  # ── Security ─────────────────────────────────────────────────────────────────
  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev

      - name: pip-audit
        run: uv run pip-audit

  # ── Tests ────────────────────────────────────────────────────────────────────
  test:
    name: Test / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # Don't cancel sibling versions on first failure
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run pytest
        run: uv run pytest --tb=short --cov --cov-branch --cov-report=xml

      - name: Upload coverage report
        # Only upload once — no point in duplicate reports from the matrix
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # ── Version bump (main only) ──────────────────────────────────────────────
  bump:
    name: Version bump
    needs: [lint, security, test]
    # Only run on direct pushes to main — not on PRs targeting main
    # Don't run unless ENABLE_VERSION_BUMP explicitly set - avoids bumping on template repo
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.ENABLE_VERSION_BUMP == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write      # Needed to push the bumped commit and version tag
      pull-requests: write # Needed to open the PR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Commitizen needs full history to determine bump type
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run commitizen bump
        id: cz
        run: |
          uv run cz bump --yes
          EXIT=$?
          if [ $EXIT -eq 21 ]; then
            # No bump-worthy commits since the last tag — nothing to do
            echo "bumped=false" >> $GITHUB_OUTPUT
          elif [ $EXIT -ne 0 ]; then
            exit $EXIT
          else
            echo "bumped=true" >> $GITHUB_OUTPUT
            echo "version=$(uv run cz version --project)" >> $GITHUB_OUTPUT
          fi

      - name: Push release branch and tag
        if: steps.cz.outputs.bumped == 'true'
        run: |
          git checkout -b release/${{ steps.cz.outputs.version }}
          # The bump commit goes to the release branch, not directly to main
          git push origin release/${{ steps.cz.outputs.version }}
          # Tags are not covered by branch protection — push separately
          git push origin v${{ steps.cz.outputs.version }}

      - name: Extract changelog entry for PR body
        if: steps.cz.outputs.bumped == 'true'
        run: |
          VERSION="${{ steps.cz.outputs.version }}"
          awk "/^## v?${VERSION}/{found=1; next} found && /^## /{exit} found{print}" \
            CHANGELOG.md > .pr-body.md

      - name: Open pull request
        if: steps.cz.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "chore: release ${{ steps.cz.outputs.version }}" \
            --body-file .pr-body.md \
            --base main \
            --head release/${{ steps.cz.outputs.version }}
